<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Dock Copilot - Edge Companion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      width: 380px;
      min-height: 480px;
      background: #131418;
      color: #e3e4e8;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 12px 16px;
      background: #181920;
      border-bottom: 1px solid #252733;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0078d4, #9b72cb, #d96570);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0, 120, 212, 0.4);
    }
    .logo-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
    }
    .logo-sub {
      font-size: 10px;
      color: #8b90a0;
      font-family: monospace;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-family: monospace;
      padding: 3px 8px;
      background: #1b2820;
      color: #7ee787;
      border: 1px solid rgba(46, 160, 67, 0.4);
      border-radius: 12px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3fb950;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    main {
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .page-card {
      background: #191b22;
      border: 1px solid #282b37;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .page-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #58a6ff;
    }
    .page-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #f0f3f6;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-url {
      font-size: 10.5px;
      color: #8b90a0;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .action-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      background: #1e212b;
      border: 1px solid #2d3142;
      color: #d1d5db;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .chip:hover {
      background: #282c3c;
      border-color: #58a6ff;
      color: white;
      transform: translateY(-1px);
    }
    .chip.primary {
      background: linear-gradient(135deg, rgba(0, 120, 212, 0.25), rgba(155, 114, 203, 0.25));
      border-color: rgba(0, 120, 212, 0.5);
      color: #79b8ff;
      font-weight: 600;
    }
    .chip.primary:hover {
      background: linear-gradient(135deg, rgba(0, 120, 212, 0.4), rgba(155, 114, 203, 0.4));
      color: white;
    }
    .chat-section {
      background: #15171d;
      border: 1px solid #242735;
      border-radius: 12px;
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-output {
      font-size: 11.5px;
      line-height: 1.5;
      color: #c9d1d9;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .composer-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1c24;
      border: 1px solid #2d3040;
      border-radius: 20px;
      padding: 4px 6px 4px 12px;
    }
    .composer-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 12px;
      color: white;
    }
    .composer-row input::placeholder {
      color: #6e7382;
    }
    .send-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0078d4;
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .send-btn:hover {
      opacity: 0.9;
    }
    footer {
      padding: 10px 16px;
      background: #14151a;
      border-top: 1px solid #232530;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      color: #8b90a0;
    }
    .open-ide-link {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .open-ide-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-group">
      <div class="logo-badge">✦</div>
      <div>
        <div class="logo-title">Agent Dock Copilot</div>
        <div class="logo-sub">Edge Companion</div>
      </div>
    </div>
    <div class="status-pill" id="status-pill">
      <div class="status-dot"></div>
      <span id="status-text">Local IDE Online</span>
    </div>
  </header>

  <main>
    <!-- Active Page Card -->
    <div class="page-card">
      <div class="page-label">Currently Viewing</div>
      <div class="page-title" id="page-title">Loading active Edge tab...</div>
      <div class="page-url" id="page-url">Reading page URL...</div>
    </div>

    <!-- Quick Action Chips -->
    <div class="action-chips">
      <button class="chip primary" id="btn-sync-page">
        🚀 Send Page to Agent Dock
      </button>
      <button class="chip" id="btn-summarize">
        📝 Summarize Page
      </button>
      <button class="chip" id="btn-open-ide">
        💻 Open Agent Dock IDE
      </button>
      <button class="chip" id="btn-open-tabs">
        🌐 Open New Tab
      </button>
    </div>

    <!-- Copilot Chat Box -->
    <div class="chat-section">
      <div class="chat-output" id="chat-output">
Ask a question about this page, or click <strong>Send Page to Agent Dock</strong> to see it inside your Cursor IDE!
      </div>
      <div class="composer-row">
        <input type="text" id="chat-input" placeholder="Ask Copilot about this tab..." />
        <button class="send-btn" id="btn-send">➔</button>
      </div>
    </div>
  </main>

  <footer>
    <span>Agent Dock Target: ~/AgentDock</span>
    <a class="open-ide-link" id="link-localhost">localhost:3000</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
